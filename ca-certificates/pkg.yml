name: 'ca-certificates'

arch: 'any'

version: '20250419'

revision: '1'

description: 'Common CA certificates'

depends:
  - 'openssl'
  - 'run-parts'
  - 'bash'
  - 'coreutils'
  - 'findutils'

makedepends:
  - 'wget'

pull: |
  wget "http://ftp.debian.org/debian/pool/main/c/ca-certificates/ca-certificates_${pkgver}_all.deb"
  ar x "ca-certificates_${pkgver}_all.deb"
  tar -xf data.tar.*

install: |
  mv usr/sbin/ usr/bin/
  cp -a usr/ etc/ -t "${pkgdir}"

  (
    echo "# Automatically generated by ca-certificates-${pkgver}"
    echo "# see update-ca-certificates man page"
    echo "# "
    cd "${pkgdir}/usr/share/ca-certificates"
    find . -name '*.crt' | sort | cut -b3-
  ) > "${pkgdir}/etc/ca-certificates.conf"

install_hook: |
  /usr/bin/update-ca-certificates --fresh &>/dev/null
