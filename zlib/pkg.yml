name: 'zlib'

arch: 'all'

version: '1.3.1'

revision: '1'

description: 'Compression library implementing the deflate compression method found in gzip and PKZIP'

makedepends:
  - 'gcc'
  - 'wget'
  - 'make'

pull: |
  wget "https://github.com/madler/zlib/releases/download/v${pkgver}/zlib-${pkgver}.tar.gz"
  tar -xf "zlib-${pkgver}.tar.gz"

build: |
  cd "zlib-${pkgver}"

  ./configure --prefix=/usr

  make -j"${nproc}"

install: |
  cd "zlib-${pkgver}"
  make DESTDIR="${pkgdir}" install
