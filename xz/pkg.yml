name: 'xz'

arch: 'all'

version: '5.8.1'

revision: '1'

description: 'Library and command line tools for XZ and LZMA compressed files'

depends:
  - 'glibc'

makedepends:
  - 'gcc'
  - 'wget'
  - 'make'

pull: |
  wget "https://github.com/tukaani-project/xz/releases/download/v${pkgver}/xz-${pkgver}.tar.gz"
  tar -xf "xz-${pkgver}.tar.gz"

build: |
  cd "xz-${pkgver}"
  # https://gitlab.archlinux.org/archlinux/packaging/packages/xz/-/blob/main/PKGBUILD
  ./configure \
    --prefix=/usr \
    --disable-rpath \
    --enable-werror
  make -j"${nproc}"

install: |
  cd "xz-${pkgver}"
  make DESTDIR="${pkgdir}" install
