name: 'mpfr'

arch: 'all'

version: '4.2.2'

revision: '1'

description: 'Multiple-precision floating-point library'

depends:
  - 'gmp'
  - 'glibc'

makedepends:
  - 'gcc'
  - 'wget'
  - 'make'

pull: |
  wget "https://ftp.gnu.org/gnu/mpfr/mpfr-${pkgver}.tar.gz"
  tar -xf "mpfr-${pkgver}.tar.gz"

build: |
  cd "mpfr-${pkgver}"

  ./configure --prefix=/usr \
    --enable-thread-safe \
    --enable-shared

  make -j"${nproc}"

install: |
  cd "mpfr-${pkgver}"
  make DESTDIR="${pkgdir}" install
  rm -f "${pkgdir}/usr/share/info/dir"
