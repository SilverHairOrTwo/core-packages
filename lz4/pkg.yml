name: 'lz4'

arch: 'all'

version: '1.10.0'

revision: '1'

description: 'Extremely fast compression algorithm'

depends:
  - 'glibc'

makedepends:
  - 'gcc'
  - 'wget'
  - 'make'

pull: |
  wget "https://github.com/lz4/lz4/releases/download/v${pkgver}/lz4-${pkgver}.tar.gz"
  tar -xf "lz4-${pkgver}.tar.gz"

build: |
  cd "lz4-${pkgver}"
  make BUILD_STATIC=no PREFIX=/usr

install: |
  cd "lz4-${pkgver}"
  make DESTDIR="${pkgdir}" BUILD_STATIC=no PREFIX=/usr install
