name: 'libffi'

arch: 'all'

version: '3.4.8'

revision: '1'

description: 'Portable foreign function interface library'

depends:
  - 'glibc'

makedepends:
  - 'gcc'
  - 'wget'
  - 'make'

pull: |
  wget "https://github.com/libffi/libffi/releases/download/v${pkgver}/libffi-${pkgver}.tar.gz"
  tar -xf "libffi-${pkgver}.tar.gz"

build: |
  cd "libffi-${pkgver}"

  ./configure \
    --disable-exec-static-tramp \
    --disable-multi-os-directory \
    --disable-static \
    --enable-pax_emutramp \
    --prefix=/usr

  make -j"${nproc}"

install: |
  cd "libffi-${pkgver}"
  make DESTDIR="${pkgdir}" install
  rm -f "${pkgdir}/usr/share/info/dir"
