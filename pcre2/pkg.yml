name: 'pcre2'

arch: 'all'

version: '10.45'

revision: '1'

description: 'A library that implements Perl 5-style regular expressions. 2nd version'

depends:
  - 'bzip2'
  - 'glibc'
  - 'readline'
  - 'zlib'

makedepends:
  - 'gcc'
  - 'wget'
  - 'make'

pull: |
  wget "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${pkgver}/pcre2-${pkgver}.tar.gz"
  tar -xf "pcre2-${pkgver}.tar.gz"

build: |
  cd "pcre2-${pkgver}"
  # https://gitlab.archlinux.org/archlinux/packaging/packages/pcre2/-/blob/main/PKGBUILD
  ./configure \
    --enable-jit \
    --enable-pcre2-16 \
    --enable-pcre2-32 \
    --enable-pcre2grep-libbz2 \
    --enable-pcre2grep-libz \
    --enable-pcre2test-libreadline \
    --prefix=/usr
  make -j"${nproc}"

install: |
  cd "pcre2-${pkgver}"
  make DESTDIR="${pkgdir}" install
