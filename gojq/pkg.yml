name: 'gojq'

arch: 'all'

version: '0.12.17'

revision: '1'

description: 'Pure go implementation of jq'

depends:
  - 'glibc'

makedepends:
  - 'go'
  - 'wget'

conflicts:
  - 'jq'

pull: |
  wget "https://github.com/itchyny/gojq/archive/v${pkgver}/gojq-${pkgver}.tar.gz"
  tar -xf "gojq-${pkgver}.tar.gz"

build: |
  cd "gojq-${pkgver}"

  go build \
    -trimpath \
    -buildmode=pie \
    -mod=readonly \
    -modcacherw \
    -o build/ \
    -ldflags "-linkmode external -extldflags \"${LDFLAGS}\"" \
    "./cmd/gojq"

install: |
  cd "gojq-${pkgver}"

  mv "build/gojq" "build/jq"
  mv _gojq _jq

  install -Dm0755 -t "${pkgdir}/usr/bin/jq" "build/jq"
  install -Dm0755 -t "${pkgdir}/usr/share/zsh/site-functions/" _jq
